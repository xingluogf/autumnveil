<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小沈秋游戏工作室</title>
    <meta name="description" content="小沈秋游戏工作室 - 独立游戏开发工作室">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #0f1117;
            color: #e6edf3;
            line-height: 1.7;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px;
            border-bottom: 1px solid #222730;
            position: sticky;
            top: 0;
            background: #0f1117;
            z-index: 99;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #58a6ff;
        }
        .nav-links a {
            color: #adbac7;
            text-decoration: none;
            margin-left: 32px;
            transition: 0.2s;
        }
        .nav-links a:hover {
            color: #58a6ff;
        }
        .soon {
            color: #6e7681 !important;
            cursor: not-allowed;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 24px;
        }
        .hero {
            text-align: center;
            margin-bottom: 80px;
        }
        .hero h1 {
            font-size: 44px;
            color: #ffffff;
            margin-bottom: 16px;
        }
        .hero p {
            font-size: 18px;
            color: #adbac7;
            max-width: 700px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 60px;
        }
        .section h2 {
            font-size: 26px;
            color: #58a6ff;
            margin-bottom: 16px;
            border-left: 4px solid #58a6ff;
            padding-left: 12px;
        }
        .card {
            background: #161b22;
            border-radius: 12px;
            padding: 28px;
            border: 1px solid #222730;
        }
        .card p {
            color: #adbac7;
            margin-bottom: 12px;
        }
        .tip-box {
            margin-top: 24px;
            padding: 16px;
            background: #1c2129;
            border-radius: 8px;
            color: #8b949e;
        }
        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #222730;
            color: #6e7681;
            font-size: 14px;
        }
        @media (max-width:720px) {
            nav {
                padding:16px 20px;
                flex-direction: column;
                gap:12px;
            }
            .nav-links a {
                margin:0 12px;
            }
            .hero h1 {
                font-size:32px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">小沈秋游戏工作室</div>
        <div class="nav-links">
            <a href="#">首页</a>
            <a href="#" class="soon">作品｜未开发</a>
            <a href="#" class="soon">关于｜未开发</a>
            <a href="#" class="soon">联系｜未开发</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>小沈秋游戏工作室</h1>
            <p>专注独立游戏、引擎定制、创意内容开发，自研沈秋引擎，打造原创游戏作品。</p>
        </div>

        <div class="section">
            <h2>工作室介绍</h2>
            <div class="card">
                <p>小沈秋游戏工作室，是一个独立游戏开发团队，主攻 Unity / Godot 引擎开发，正在自研【沈秋引擎】。</p>
                <p>我们专注原创游戏项目开发，同时进行脚本、地图、网站、工具开发。</p>
                <p>工作室持续探索独立游戏的创意玩法，稳步推进项目迭代。</p>
            </div>
        </div>

        <div class="section">
            <h2>说明</h2>
            <div class="card">
                <p>本网站处于早期搭建阶段，导航栏【作品、关于、联系】页面均未开发，后续逐步更新。</p>
                <p>如果你想联系工作室，可以等待联系页面上线。</p>
            </div>
        </div>
    </div>

    <footer>
        © 2026 小沈秋游戏工作室 | 站点建设中
    </footer>
</body>
</html>
